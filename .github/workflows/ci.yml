name: CI

# The same four checks CLAUDE.md asks for before committing, run on the push
# itself so they do not depend on remembering to run them locally.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      # Includes the conformance suite: every fixture in Verification/TDD/graphs
      # is judged against the obligation set of Algorithm_Design.md §1.4.
      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      # serve mode runs the TypeScript sources through tsx, so a broken CLI
      # entry point would not show up in the vite build.
      - name: CLI entry point
        run: npm run build:cli

      # The published manual is a mirror of Doc/, copied by hand on each publish
      # (see deploy/README.md and the publish-manual skill). Nothing else notices
      # when the two drift: the public-files workflow builds and deploys whatever
      # the mirror holds, however old. It once ran five weeks behind.
      - name: Published manuals match Doc/
        run: |
          status=0
          for f in User_Manual CLI_User_Manual DSL_Grammar_Specification; do
            url="https://raw.githubusercontent.com/sho1884/public-files/main/NeoCEG/docs/$f.md"
            if ! curl -fsSL -o "/tmp/$f.md" "$url"; then
              echo "::error::could not fetch the published $f.md"
              status=1
              continue
            fi
            if ! diff -q "/tmp/$f.md" "Doc/$f.md" >/dev/null; then
              echo "::error file=Doc/$f.md::differs from the published copy — re-publish public-files/NeoCEG/docs/"
              diff "/tmp/$f.md" "Doc/$f.md" | head -20
              status=1
            fi
          done
          exit $status
